<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unblocked Browser</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        body {
            background-color: #1a1a1a;
            color: #ffffff;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }
        
        .browser-header {
            background-color: #2d2d30;
            padding: 8px 10px;
            display: flex;
            align-items: center;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.3);
        }
        
        .browser-controls {
            display: flex;
            margin-right: 10px;
        }
        
        .browser-btn {
            background-color: #3e3e42;
            border: none;
            width: 30px;
            height: 30px;
            border-radius: 50%;
            margin-right: 8px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background-color 0.2s;
        }
        
        .browser-btn:hover {
            background-color: #505054;
        }
        
        .url-bar {
            flex-grow: 1;
            background-color: #3e3e42;
            border: 1px solid #5a5a5a;
            padding: 8px 15px;
            border-radius: 16px;
            color: #ffffff;
            font-size: 14px;
            outline: none;
        }
        
        .url-bar:focus {
            border-color: #007acc;
        }
        
        .settings-btn {
            background-color: #3e3e42;
            border: none;
            width: 30px;
            height: 30px;
            border-radius: 50%;
            margin-left: 8px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background-color 0.2s;
        }
        
        .settings-btn:hover {
            background-color: #505054;
        }
        
        .browser-content {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        
        .iframe-container {
            flex-grow: 1;
            position: relative;
            background-color: #252526;
        }
        
        .browser-iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
        
        .settings-panel {
            position: absolute;
            top: 50px;
            right: 10px;
            width: 300px;
            background-color: #2d2d30;
            border: 1px solid #3e3e42;
            border-radius: 8px;
            padding: 15px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.3);
            display: none;
            z-index: 1000;
        }
        
        .settings-panel.active {
            display: block;
        }
        
        .settings-title {
            font-size: 16px;
            margin-bottom: 15px;
            color: #cccccc;
        }
        
        .setting-item {
            margin-bottom: 12px;
        }
        
        .setting-label {
            display: block;
            margin-bottom: 5px;
            font-size: 13px;
            color: #cccccc;
        }
        
        .setting-input {
            width: 100%;
            background-color: #3e3e42;
            border: 1px solid #5a5a5a;
            padding: 6px 10px;
            border-radius: 4px;
            color: #ffffff;
            font-size: 13px;
            outline: none;
        }
        
        .setting-input:focus {
            border-color: #007acc;
        }
        
        .setting-select {
            width: 100%;
            background-color: #3e3e42;
            border: 1px solid #5a5a5a;
            padding: 6px 10px;
            border-radius: 4px;
            color: #ffffff;
            font-size: 13px;
            outline: none;
        }
        
        .setting-checkbox {
            margin-right: 8px;
        }
        
        .setting-btn {
            background-color: #007acc;
            color: white;
            border: none;
            padding: 8px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 13px;
            transition: background-color 0.2s;
        }
        
        .setting-btn:hover {
            background-color: #005a9e;
        }
        
        .proxy-status {
            position: absolute;
            bottom: 10px;
            right: 10px;
            background-color: rgba(0, 122, 204, 0.8);
            padding: 5px 10px;
            border-radius: 4px;
            font-size: 12px;
            display: none;
        }
        
        .proxy-status.active {
            display: block;
        }
        
        .tab-bar {
            display: flex;
            background-color: #2d2d30;
            border-bottom: 1px solid #3e3e42;
            padding: 0 10px;
            overflow-x: auto;
        }
        
        .tab {
            background-color: #3e3e42;
            border: none;
            padding: 8px 15px;
            margin-right: 5px;
            border-radius: 8px 8px 0 0;
            color: #cccccc;
            cursor: pointer;
            white-space: nowrap;
            display: flex;
            align-items: center;
        }
        
        .tab.active {
            background-color: #252526;
            color: #ffffff;
        }
        
        .tab-close {
            margin-left: 8px;
            font-size: 16px;
            line-height: 1;
            cursor: pointer;
        }
        
        .new-tab-btn {
            background-color: #3e3e42;
            border: none;
            width: 30px;
            height: 30px;
            border-radius: 50%;
            margin: 5px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background-color 0.2s;
        }
        
        .new-tab-btn:hover {
            background-color: #505054;
        }
        
        .loading-indicator {
            position: absolute;
            top: 0;
            left: 0;
            height: 3px;
            background-color: #007acc;
            width: 0;
            transition: width 0.3s;
            z-index: 100;
        }
        
        .loading-indicator.active {
            animation: loading 2s infinite;
        }
        
        @keyframes loading {
            0% { width: 0; }
            50% { width: 70%; }
            100% { width: 100%; }
        }
        
        .notification {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background-color: rgba(0, 122, 204, 0.9);
            color: white;
            padding: 10px 20px;
            border-radius: 4px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.3);
            display: none;
            z-index: 1000;
        }
        
        .notification.show {
            display: block;
            animation: fadeInOut 3s forwards;
        }
        
        @keyframes fadeInOut {
            0% { opacity: 0; }
            20% { opacity: 1; }
            80% { opacity: 1; }
            100% { opacity: 0; }
        }
    </style>
</head>
<body>
    <div class="browser-header">
        <div class="browser-controls">
            <button class="browser-btn" id="back-btn" title="Back">←</button>
            <button class="browser-btn" id="forward-btn" title="Forward">→</button>
            <button class="browser-btn" id="refresh-btn" title="Refresh">↻</button>
            <button class="browser-btn" id="home-btn" title="Home">⌂</button>
        </div>
        <input type="text" class="url-bar" id="url-bar" placeholder="Enter URL or search terms..." value="https://">
        <button class="settings-btn" id="settings-btn" title="Settings">⚙</button>
    </div>
