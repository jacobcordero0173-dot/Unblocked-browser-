<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unblocked Browser</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: Arial, sans-serif;
            background-color: #f5f5f5;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }
        
        .browser-header {
            background-color: #333;
            padding: 10px;
            display: flex;
            align-items: center;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.2);
        }
        
        .url-container {
            flex-grow: 1;
            display: flex;
            align-items: center;
        }
        
        .url-input {
            width: 100%;
            padding: 10px;
            border: none;
            border-radius: 4px;
            font-size: 16px;
            background-color: #444;
            color: white;
        }
        
        .go-button {
            background-color: #4285f4;
            color: white;
            border: none;
            padding: 10px 20px;
            margin-left: 10px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
        }
        
        .go-button:hover {
            background-color: #3367d6;
        }
        
        .browser-content {
            flex-grow: 1;
            position: relative;
            overflow: hidden;
        }
        
        .website-frame {
            width: 100%;
            height: 100%;
            border: none;
        }
        
        .loading {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 3px;
            background-color: #4285f4;
            display: none;
        }
        
        .loading.active {
            display: block;
            animation: loading 2s infinite;
        }
        
        @keyframes loading {
            0% { width: 0%; }
            50% { width: 70%; }
            100% { width: 100%; }
        }
        
        .proxy-options {
            display: flex;
            margin-right: 10px;
        }
        
        .proxy-button {
            background-color: #444;
            color: white;
            border: none;
            padding: 8px 12px;
            margin-left: 5px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
        }
        
        .proxy-button:hover {
            background-color: #555;
        }
        
        .proxy-button.active {
            background-color: #4285f4;
        }
    </style>
</head>
<body>
    <div class="browser-header">
        <div class="proxy-options">
            <button class="proxy-button" id="direct-btn">Direct</button>
            <button class="proxy-button" id="cors-proxy-btn">CORS Proxy</button>
            <button class="proxy-button" id="web-proxy-btn">Web Proxy</button>
        </div>
        <div class="url-container">
            <input type="text" class="url-input" id="url-input" placeholder="Enter website URL..." value="https://">
            <button class="go-button" id="go-button">Go</button>
        </div>
    </div>
    
    <div class="browser-content">
        <div class="loading" id="loading"></div>
        <iframe class="website-frame" id="website-frame" sandbox="allow-same-origin allow-scripts allow-popups allow-forms"></iframe>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const urlInput = document.getElementById('url-input');
            const goButton = document.getElementById('go-button');
            const websiteFrame = document.getElementById('website-frame');
            const loading = document.getElementById('loading');
            const directBtn = document.getElementById('direct-btn');
            const corsProxyBtn = document.getElementById('cors-proxy-btn');
            const webProxyBtn = document.getElementById('web-proxy-btn');
            
            let currentProxy = 'direct';
            
            // Set default proxy to CORS proxy for better compatibility
            corsProxyBtn.classList.add('active');
            currentProxy = 'cors-proxy';
            
            function navigateToUrl() {
                let url = urlInput.value.trim();
                
                if (!url) return;
                
                // Add https:// if missing
                if (!url.startsWith('http://') && !url.startsWith('https://')) {
                    url = 'https://' + url;
                }
                
                // Show loading indicator
                loading.classList.add('active');
                
                // Use different proxy methods based on selection
                let finalUrl = url;
                
                if (currentProxy === 'cors-proxy') {
                    // Using a CORS proxy service (you can replace with any CORS proxy service)
                    finalUrl = `https://cors-anywhere.herokuapp.com/${url}`;
                } else if (currentProxy === 'web-proxy') {
                    // Using a web proxy service (you can replace with any web proxy service)
                    finalUrl = `https://r.jina.ai/http://${url}`;
                }
                
                // Load the website in the iframe
                websiteFrame.src = finalUrl;
                
                // Update URL input to show the actual URL
                urlInput.value = url;
                
                // Hide loading indicator when loaded
                websiteFrame.onload = function() {
                    setTimeout(() => {
                        loading.classList.remove('active');
                    }, 500);
                };
                
                websiteFrame.onerror = function() {
                    loading.classList.remove('active');
                    showNotification('Failed to load the website. Try using a different proxy method.');
                };
            }
            
            // Event listeners
            goButton.addEventListener('click', navigateToUrl);
            
            urlInput.addEventListener('keypress', function(e) {
                if (e.key === 'Enter') {
                    navigateToUrl();
                }
            });
            
            // Proxy button event listeners
            directBtn.addEventListener('click', function() {
                document.querySelectorAll('.proxy-button').forEach(btn => btn.classList.remove('active'));
                this.classList.add('active');
                currentProxy = 'direct';
                if (websiteFrame.src && websiteFrame.src !== 'about:blank') {
                    navigateToUrl();
                }
            });
            
            corsProxyBtn.addEventListener('click', function() {
                document.querySelectorAll('.proxy-button').forEach(btn => btn.classList.remove('active'));
                this.classList.add('active');
                currentProxy = 'cors-proxy';
                if (websiteFrame.src && websiteFrame.src !== 'about:blank') {
                    navigateToUrl();
                }
            });
            
            webProxyBtn.addEventListener('click', function() {
                document.querySelectorAll('.proxy-button').forEach(btn => btn.classList.remove('active'));
                this.classList.add('active');
                currentProxy = 'web-proxy';
                if (websiteFrame.src && websiteFrame.src !== 'about:blank') {
                    navigateToUrl();
                }
            });
            
            // Function to show notification
            function showNotification(message) {
                const notification = document.createElement('div');
                notification.style.position = 'absolute';
                notification.style.bottom = '20px';
                notification.style.left = '50%';
                notification.style.transform = 'translateX(-50%)';
                notification.style.backgroundColor = '#333';
                notification.style.color = 'white';
                notification.style.padding = '10px 20px';
                notification.style.borderRadius = '4px';
                notification.style.zIndex = '1000';
                notification.textContent = message;
                
                document.querySelector('.browser-content').appendChild(notification);
                
                setTimeout(() => {
                    notification.remove();
                }, 3000);
            }
            
            // Load a default page
            urlInput.value = 'https://example.com';
            navigateToUrl();
        });
    </script>
</body>
</html>
